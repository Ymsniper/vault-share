<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} - File sharing</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand bg-body-tertiary mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('files.index') }}">File sharing</a>
      <ul class="navbar-nav ms-auto">
        {% if g.user %}
          <li class="nav-item"><span class="navbar-text me-3">{{ g.user['username'] }}</span></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('auth.logout') }}">Log out</a></li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('auth.register') }}">Register</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('auth.login') }}">Log in</a></li>
        {% endif %}
      </ul>
    </div>
  </nav>
  <main class="container">
    {% for message in get_flashed_messages() %}
      <div class="alert alert-warning">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
