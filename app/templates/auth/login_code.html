{% extends "base.html" %}
{% block title %}Two-factor code{% endblock %}
{% block content %}
<div class="vs-gate">
  {% include "partials/gate_art.html" %}
  <div class="vs-gate-copy">
    <p class="vs-kicker">Second factor</p>
    <h1>Two-factor <em>code</em></h1>
    <p class="vs-lede">Open your authenticator app and type the code it shows now.</p>
    <form method="post" class="vs-panel">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-4">
        <label for="code" class="form-label">Code from your authenticator app</label>
        <input name="code" id="code" class="form-control vs-code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <p class="vs-or" aria-hidden="true">or</p>
    <form method="post" class="vs-panel vs-panel-quiet">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-4">
        <label for="recovery" class="form-label">Lost your phone? A recovery code</label>
        <input name="recovery" id="recovery" class="form-control vs-mono vs-recovery-input" autocomplete="off" spellcheck="false" autocapitalize="characters" maxlength="40" placeholder="XXXX-XXXX-XXXX-XXXX" required>
      </div>
      <button type="submit" class="btn btn-outline-secondary">Log in with it</button>
    </form>
  </div>
</div>
{% endblock %}
