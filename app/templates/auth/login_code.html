{% extends "base.html" %}
{% block title %}Code{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Two-factor code</h1>
<form method="post" class="col-md-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label for="code" class="form-label">Code from your authenticator app</label>
    <input name="code" id="code" class="form-control" inputmode="numeric" autocomplete="one-time-code" required autofocus>
  </div>
  <button type="submit" class="btn btn-primary">Log in</button>
</form>
{% endblock %}
