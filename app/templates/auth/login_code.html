{% extends "base.html" %}
{% block title %}Code{% endblock %}
{% block content %}
<div class="vs-gate">
  <div class="vs-gate-emblem">{% include "partials/emblem.svg" %}</div>
  <h1>Two-factor code</h1>
  <p class="vs-lede">Open your authenticator app and type the code it shows now.</p>
  <form method="post" class="vs-panel">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-4">
      <label for="code" class="form-label">Code from your authenticator app</label>
      <input name="code" id="code" class="form-control vs-code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
</div>
{% endblock %}
