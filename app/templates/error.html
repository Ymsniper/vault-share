{% extends "base.html" %}
{% block title %}{{ error.code }}{% endblock %}
{% block content %}
<div class="vs-gate">
  <span class="vs-error-code" aria-hidden="true">{{ error.code }}</span>
  <h1>{{ error.code }} {{ error.name }}</h1>
  <p class="vs-lede">{{ error.description }}</p>
  <p class="vs-gate-foot">
    {% if g.user %}<a href="{{ url_for('files.index') }}">Back to my files</a>
    {% else %}<a href="{{ url_for('auth.login') }}">Log in</a>{% endif %}
  </p>
</div>
{% endblock %}
